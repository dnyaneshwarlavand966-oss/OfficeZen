name: Build Debug APK

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Print debug signing certificate fingerprints
        run: |
          keytool -list -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey | grep -E 'SHA1:|SHA256:'

      - name: Ensure google-services.json is present
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import sys

          target = "app/google-services.json"
          raw_secret = os.environ.get("GOOGLE_SERVICES_JSON", "").strip()
          b64_secret = os.environ.get("GOOGLE_SERVICES_JSON_BASE64", "").strip()

          if not os.path.exists(target):
              if raw_secret:
                  content = raw_secret
                  if not content.lstrip().startswith("{"):
                      try:
                          content = base64.b64decode("".join(content.split())).decode("utf-8")
                      except Exception as exc:
                          print(f"::error::GOOGLE_SERVICES_JSON secret is neither valid JSON nor valid base64: {exc}")
                          sys.exit(1)
                  with open(target, "w", encoding="utf-8") as f:
                      f.write(content.rstrip() + "\n")
                  print("Restored app/google-services.json from GOOGLE_SERVICES_JSON secret.")
              elif b64_secret:
                  try:
                      content = base64.b64decode("".join(b64_secret.split())).decode("utf-8")
                  except Exception as exc:
                      print(f"::error::Failed to decode GOOGLE_SERVICES_JSON_BASE64 secret: {exc}")
                      sys.exit(1)
                  with open(target, "w", encoding="utf-8") as f:
                      f.write(content.rstrip() + "\n")
                  print("Restored app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret.")
              else:
                  print(
                      "::error::Missing app/google-services.json and GitHub Actions secret GOOGLE_SERVICES_JSON is not set.\n"
                      "How to configure it:\n"
                      "1. Open your GitHub repository -> Settings -> Secrets and variables -> Actions.\n"
                      "2. Click 'New repository secret'.\n"
                      "3. Set Name to: GOOGLE_SERVICES_JSON\n"
                      "4. Copy the full JSON contents of app/google-services.json from your AI Studio project and paste it as the secret Value.\n"
                      "5. Save the secret and re-run the 'Build Debug APK' workflow."
                  )
                  sys.exit(1)

          try:
              with open(target, "r", encoding="utf-8") as f:
                  data = json.load(f)
          except Exception as exc:
              print(f"::error::app/google-services.json is not valid JSON: {exc}")
              sys.exit(1)

          expected_pkg = "com.aistudio.officezen.kzmrxp"
          expected_project = "officezen-d42ad"
          project_id = data.get("project_info", {}).get("project_id", "")
          if not project_id or "remixed" in project_id.lower() or "dummy" in project_id.lower():
              print(f"::error::Invalid Firebase project_id in app/google-services.json: {project_id!r}")
              sys.exit(1)
          if project_id != expected_project:
              print(
                  f"::error::app/google-services.json targets Firebase project '{project_id}', "
                  f"expected '{expected_project}'. Update the GOOGLE_SERVICES_JSON GitHub secret with the latest app/google-services.json."
              )
              sys.exit(1)

          with open("app/src/main/res/values/firebase_applet_config.xml", "r", encoding="utf-8") as cfg_f:
              cfg_xml = cfg_f.read()
          if "officezen-db" not in cfg_xml:
              print("::error::firebase_applet_config.xml is missing Firestore database ID 'officezen-db'.")
              sys.exit(1)

          clients = data.get("client") or []
          matching_clients = [
              c for c in clients
              if c.get("client_info", {}).get("android_client_info", {}).get("package_name") == expected_pkg
          ]
          if not matching_clients:
              found = [
                  c.get("client_info", {}).get("android_client_info", {}).get("package_name")
                  for c in clients
              ]
              print(f"::error::app/google-services.json does not contain package {expected_pkg}. Found: {found}")
              sys.exit(1)

          client = matching_clients[0]
          oauth_clients = list(client.get("oauth_client") or [])
          other_clients = list(
              client.get("services", {}).get("appinvite_service", {}).get("other_platform_oauth_client") or []
          )
          web_clients = [
              o.get("client_id", "")
              for o in (oauth_clients + other_clients)
              if o.get("client_type") == 3 and o.get("client_id")
          ]
          if not web_clients:
              print(
                  "::error::app/google-services.json does not contain an OAuth web client (client_type: 3). "
                  "R.string.default_web_client_id cannot be generated without it."
              )
              sys.exit(1)

          print(f"Validated app/google-services.json (project_id={project_id}, db=officezen-db, package={expected_pkg}, oauth_web_clients={len(web_clients)}).")
          PY

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build Debug APK
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew :app:processDebugGoogleServices :app:assembleDebug --no-daemon --stacktrace
          else
            gradle :app:processDebugGoogleServices :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: officezen-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
